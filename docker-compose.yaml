services:
  postgres:
    image: postgres:16.1-alpine
    # Keep the DB alive across reboots and don't let it end up as a stopped
    # container a `docker system prune` could sweep away (dev/qa data safety).
    restart: unless-stopped
    ports:
      - ${DATABASE_PORT}:5432
    volumes:
      - boilerplate-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

  maildev:
    build:
      context: .
      dockerfile: maildev.Dockerfile
    ports:
      - ${MAIL_CLIENT_PORT}:1080
      - ${MAIL_PORT}:1025

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  # Uncomment to use redis
  redis:
    image: redis:7-alpine
    # Keep redis (Bull queues) alive across reboots and prunes.
    restart: unless-stopped
    ports:
      - 6379:6379

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - ${APP_PORT}:${APP_PORT}
    volumes:
      - ./src:/usr/src/app/src
      
volumes:
  boilerplate-db:
